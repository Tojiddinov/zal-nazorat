<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Zal Nazorat</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view" class="view"></main>

<div id="restbar" class="restbar" hidden>
  <div class="rest-fill" id="restFill"></div>
  <div class="rest-row">
    <div><div class="rest-label" id="restLabel">Dam olish</div><div class="rest-time" id="restTime">0:00</div></div>
    <div class="rest-btns">
      <button class="btn small" data-act="restAdd">+15 s</button>
      <button class="btn small" data-act="restSkip">O‘tkazish</button>
    </div>
  </div>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="today">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
    <span>Bugun</span>
  </button>
  <button data-tab="program">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Dastur</span>
  </button>
  <button data-tab="library">
    <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
    <span>Mashqlar</span>
  </button>
  <button data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M4 20h16M7 16.5v-5M12 16.5V6M17 16.5v-8"/></svg>
    <span>Natijalar</span>
  </button>
</nav>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
